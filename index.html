<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文献库</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="search" type="application/opensearchdescription+xml" href="opensearch.xml" title="期刊文献数据库搜索">
</head>
<body>
<header id="app-topbar" class="topbar">
    <div class="topbar-inner">
        <div class="brand-row">
            <span class="brand-name">文献库</span>
            <span id="topbar-meta" class="brand-meta">Loading</span>
        </div>
        <nav class="topbar-actions" aria-label="Primary">
            <button id="authors-link" class="text-button" type="button">Authors</button>
            <button id="favorites-toggle" class="icon-button" type="button" aria-label="Favorites" aria-pressed="false">
                <span aria-hidden="true">☆</span>
                <span id="favorite-count" class="button-count">0</span>
            </button>
            <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle theme" aria-pressed="false">
                <span aria-hidden="true">◐</span>
            </button>
        </nav>
    </div>
</header>

<div id="journal-strip" class="journal-strip">
    <div id="journal-pills" class="journal-pills" aria-label="Journals"></div>
</div>

<main class="page-shell">
    <section id="main-view" class="view active" aria-label="Articles">
        <div id="global-loading" class="loading-line" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span id="loading-text">Loading</span>
        </div>

        <form id="search-form" class="search-form">
            <div class="search-control">
                <input
                    id="search-input"
                    class="search-input"
                    type="search"
                    placeholder="Search by title, author, or abstract..."
                    autocomplete="off"
                    spellcheck="false"
                >
                <select id="search-mode-select" class="mode-select" aria-label="Search mode">
                    <option value="all">全部字段</option>
                    <option value="title_abstract">标题与摘要</option>
                    <option value="author">作者</option>
                    <option value="journal">期刊</option>
                </select>
            </div>
        </form>

        <div class="result-bar">
            <div id="result-summary" class="result-summary">Showing 0 articles</div>
            <div class="result-actions">
                <button id="filters-toggle" class="plain-button" type="button" aria-expanded="false" aria-controls="filters-panel">
                    <span>Filters</span>
                    <span id="filters-badge" class="filter-badge" hidden></span>
                    <span aria-hidden="true">▾</span>
                </button>
                <div class="menu-wrap">
                    <button id="sort-toggle" class="plain-button" type="button" aria-expanded="false" aria-controls="sort-menu">
                        Sort: Newest ▾
                    </button>
                    <div id="sort-menu" class="menu" role="menu" hidden>
                        <button type="button" role="menuitem" data-sort-value="year_desc">年份新→旧</button>
                        <button type="button" role="menuitem" data-sort-value="year_asc">年份旧→新</button>
                        <button type="button" role="menuitem" data-sort-value="title">按标题</button>
                        <button type="button" role="menuitem" data-sort-value="author">按作者</button>
                        <button type="button" role="menuitem" data-sort-value="journal">按期刊</button>
                    </div>
                </div>
            </div>
        </div>

        <section id="filters-panel" class="filters-panel" hidden>
            <div class="filter-grid">
                <label class="field-label" for="year-from">
                    <span>From</span>
                    <input id="year-from" class="field" type="number" inputmode="numeric" min="1800" max="2100">
                </label>
                <label class="field-label" for="year-to">
                    <span>To</span>
                    <input id="year-to" class="field" type="number" inputmode="numeric" min="1800" max="2100">
                </label>
                <label class="switch-field" for="has-abstract-only">
                    <input id="has-abstract-only" type="checkbox">
                    <span class="switch-track" aria-hidden="true"></span>
                    <span>只看有摘要</span>
                </label>
            </div>
            <div id="selected-journal-list" class="selected-journal-list"></div>
        </section>

        <div id="result-list" class="article-list" aria-live="polite"></div>
        <div id="load-more-row" class="load-more-row" hidden>
            <button id="load-more" class="load-more-button" type="button">Load more</button>
        </div>
    </section>

    <section id="favorites-view" class="view" aria-label="Favorites">
        <div class="view-header">
            <button id="favorites-back" class="back-button" type="button">← Back</button>
            <div>
                <h1>收藏</h1>
                <p id="favorites-summary" class="view-meta"></p>
            </div>
            <div class="menu-wrap export-wrap">
                <button id="export-toggle" class="plain-button" type="button" aria-expanded="false" aria-controls="export-menu">Export ▾</button>
                <div id="export-menu" class="menu" role="menu" hidden>
                    <button id="export-favorites-bibtex" type="button" role="menuitem">BibTeX</button>
                    <button id="export-favorites-csv" type="button" role="menuitem">CSV</button>
                    <button id="export-favorites-json" type="button" role="menuitem">JSON</button>
                </div>
            </div>
        </div>

        <form class="sync-panel" aria-label="Favorite sync">
            <div class="sync-grid">
                <label class="field-label" for="sync-endpoint">
                    <span>Sync endpoint</span>
                    <input id="sync-endpoint" class="field" type="url" autocomplete="off" spellcheck="false">
                </label>
                <label class="field-label" for="sync-key">
                    <span>Sync key</span>
                    <input id="sync-key" class="field" type="password" autocomplete="off" spellcheck="false">
                </label>
                <div class="sync-actions">
                    <button id="sync-save" class="plain-button" type="button">Save</button>
                    <button id="sync-pull" class="plain-button" type="button">Pull</button>
                    <button id="sync-push" class="plain-button" type="button">Push</button>
                </div>
            </div>
            <p id="sync-status" class="sync-status" role="status" aria-live="polite"></p>
        </form>

        <div class="favorites-workspace">
            <aside class="favorites-tree-panel" aria-label="Favorite folders">
                <div class="folder-tools">
                    <input id="favorite-folder-path" class="field" type="text" placeholder="教育分层/水平分层">
                    <button id="create-favorite-folder" class="plain-button" type="button">New</button>
                </div>
                <div class="folder-actions">
                    <button id="rename-favorite-folder" class="plain-button" type="button">Rename</button>
                    <button id="delete-favorite-folder" class="plain-button" type="button">Delete</button>
                </div>
                <div id="favorite-folder-tree" class="folder-tree"></div>
            </aside>
            <section id="favorites-list" class="favorites-list-panel" aria-label="Favorite articles"></section>
        </div>
    </section>

    <section id="authors-view" class="view" aria-label="Authors">
        <div class="view-header">
            <button id="authors-back" class="back-button" type="button">← Back</button>
            <div>
                <h1>Authors</h1>
                <p id="authors-summary" class="view-meta"></p>
            </div>
            <label class="min-author-filter" for="author-min-input">
                <span>Min. articles:</span>
                <input id="author-min-input" class="field" type="number" min="1" value="10">
            </label>
        </div>
        <div id="author-list" class="author-list"></div>
    </section>
</main>

<script id="article-schema" type="application/ld+json"></script>
<script src="vendor/sqljs/sql-wasm.js"></script>
<script src="app.js"></script>
</body>
</html>
