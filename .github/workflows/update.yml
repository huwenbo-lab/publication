name: Weekly Update

on:
  schedule:
    - cron: "10 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-publication-update
  cancel-in-progress: false

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip xlrd

      - name: Update articles
        run: python scripts/update.py --days 30 --skip-derived

      - name: Rebuild derived outputs
        run: |
          python scripts/build_article_api.py
          python scripts/build_lit_db.py
          python scripts/build_search_db.py
          python scripts/check_quality.py
          python scripts/audit_non_articles.py --dry-run

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json data.json data.js lit_db api docs/reports/update_log.md docs/reports/data_quality_report.md docs/reports/non_article_audit_report.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Weekly data refresh"
          git push origin HEAD:main
